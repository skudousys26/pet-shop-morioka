<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/css/introduction.css">

    <title>子犬・子猫の紹介</title>
</head>
<body>
    <main>
        <section class="introduction">
            <div class="pet-visual">
                <img src="images/dog1.jpg" alt="犬１">
                <div class="pet-introduction">
                    <div class="pet-name">
                        <h3>レオ</h3>
                        <p>オス</p>


                        
                    </div>
                    <p>普段はおとなしいけど</p>
                    <p>散歩のときや、遊んであげているときは</p>
                    <p>元気いっぱいのゴールデンレトリバーです。</p>

                </div>
            </div>

        </section>
                <section class="introduction">
            <div class="pet-visual">
                <img src="images/dog2.jpg" alt="犬２">
                <div class="pet-introduction">
                    <div class="pet-name">
                        <h3>きなこ</h3>
                        <p>メス</p>

                        
                    </div>
                    <p>いつも元気いっぱいで</p>
                    <p>人を見かけると構ってもらいに行く</p>
                    <p>人懐っこいトイプードルです。</p>

                </div>
            </div>

        </section>
                <section class="introduction">
            <div class="pet-visual">
                <img src="images/cat1.jpg" alt="猫１">
                <div class="pet-introduction">
                    <div class="pet-name">
                        <h3>ラテ</h3>
                        <p>オス</p>

                        
                    </div>
                    <p>一人でいるのがが好きで</p>
                    <p>たまに寒いときに一緒にいたがる</p>
                    <p>甘えん坊さんのサイベリアンです。</p>

                </div>
            </div>

        </section>
                <section class="introduction">
            <div class="pet-visual">
                <img src="images/cat2.jpg" alt="猫２">
                <div class="pet-introduction">
                    <div class="pet-name">
                        <h3>きなこ</h3>
                        <p>メス</p>

                        
                    </div>
                    <p>隙間や段ボールの中が好きで</p>
                    <p>たまに高いところに上って降りられなくなってる</p>
                    <p>ドジっ子なボンベイです。</p>

                </div>
            </div>

        </section>



    </main>

    
</body>
</html>
