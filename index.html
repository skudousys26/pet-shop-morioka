<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ペットショップ盛岡</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <main>
        <section class="hero">
            <img src="images/topHero.jpg" alt="犬と猫の画像">
        </section>

        <section class="introduction">
            <h1>ペットショップ盛岡</h1>
            <p>ペットショップ盛岡は創業10年で、、、、、、です。<br>
                主に犬と猫を専門に、、、、、、、、、、、、<br>
                店内は清潔に保たれており、、、、、、、、<br>
                ご来店お待ちしております、、、、、、、、、。<br>
            </p>
        </section>
        
        <section class="pickUp">
            <h1>ペット紹介</h1>
            
            <h2>犬</h2>
            <section class="dogs">
                <!-- 犬カード1 -->
                <div class="card">
                    <img src="images/dog4.jpg" alt="犬の画像4">
                    <p>イタリアングレーハウンド（ミルクちゃん）</p>
                </div>

                <!-- 犬カード2 -->
                <div class="card">
                    <img src="images/dog1.jpg" alt="犬の画像1">
                    <p>犬種（ダンくん）</p>
                </div>

                <!-- 犬カード3 -->
                <div class="card">
                    <img src="images/dog5.jpg" alt="犬の画像5">
                    <p>グレートピレニーズ（ボンドくん）</p>
                </div>
            </section>

            <h2>猫</h2>
            <section class="cats">
                <!-- 猫カード1 -->
                <div class="card">
                    <img src="images/cat1.jpg" alt="猫の画像1">
                    <p>アメリカンショートヘア</p>
                </div>
                
                <!-- 猫カード2 -->
                <div class="card">
                    <img src="images/cat1.jpg" alt="猫の画像1">
                    <p>マンチカン</p>
                </div>
                
                <!-- 猫カード3 -->
                <div class="card">
                    <img src="images/cat1.jpg" alt="猫の画像1">
                    <p>スコティッシュフォールド</p>
                </div>
            </section>

            <a href="" class="moreLink">もっと見る</a>
        </section>

        <section class="serviceIntroduction">
            <!-- 子犬・子猫の紹介／トリミング／ペット用品／お店の案内 へ飛ぶリンク -->
        </section>

        <section class="access">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3069.5515975599046!2d141.14021717469!3d39.70478479866505!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5f857630971ceb65%3A0xa71278d9c8f84080!2zTUNM55ub5bKh5oOF5aCx44OT44K444ON44K577yG44OH44K244Kk44Oz5bCC6ZaA5a2m5qChIOODh-OCtuOCpOODs-aDheWgsemkqA!5e0!3m2!1sja!2sjp!4v1793841019480!5m2!1sja!2sjp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
    </main>
</body>
</html>
